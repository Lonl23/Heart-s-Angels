<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>RESCUETRACK - Patient</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="style.css?v=3">
  <style>
    .triage-picker { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .triage-choice { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; text-align: left; text-decoration: none; padding: 12px 14px; border-radius: 12px; border: 1.5px solid #E3E0DC; background: #fff; color: #1A1514; cursor: pointer; }
    .triage-choice strong { display: block; font-family: 'DM Mono', ui-monospace, monospace; font-size: 15px; }
    .triage-choice span { display: block; font-size: 12px; color: #7A7470; font-weight: 500; text-transform: none; letter-spacing: 0; }
    .triage-choice.is-on { color: #fff; border-color: transparent; }
    .triage-choice.is-on span { color: rgba(255,255,255,.9); }
    .triage-choice.u1.is-on { background: #A32D2D; }
    .triage-choice.u2.is-on { background: #BA7517; }
    .triage-choice.u3h.is-on { background: #185FA5; }
    .triage-choice.u3nh.is-on { background: #3B6D11; }
    .triage-choice.implique.is-on { background: #4A4542; }
    .triage-choice.dcd.is-on { background: #1A1514; }
    .field-block label.check-inline { display: flex; flex-direction: row; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font-size: 14px; }
    .check-inline input { width: 18px; min-height: 18px; margin: 0; }
    @media (max-width: 720px) { .triage-picker { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">
      RESCUETRACK
      <span class="app-subtitle">Fiche patient</span>
    </div>
    <div class="header-right"><span id="time"></span></div>
  </header>

  <main class="page-content">
    <section class="page-shell">
      <section class="patient-topbar">
        <button id="backToEventBtn" class="btn-secondary">← Retour au préventif</button>
        <div class="patient-mode-label" id="patientModeLabel">Nouvelle fiche patient</div>
      </section>

      <section class="patient-main-card">
        <div class="patient-header-block">
          <div>
            <h1 class="patient-main-title">Fiche patient</h1>
            <p class="patient-subtitle" id="eventContext"></p>
          </div>
          <div class="patient-code-box">
            <span>Code patient</span>
            <strong id="patientCodeDisplay">Attribué à l'enregistrement</strong>
          </div>
        </div>

        <div class="patient-sections-grid">
          <section class="patient-card">
            <div id="eidMount"></div>
            <h2 class="section-title">Identité et administratif</h2>

            <div class="patient-grid-3">
              <div class="field-block">
                <label class="check-inline" for="unknownIdentityCheckbox">
                  <input type="checkbox" id="unknownIdentityCheckbox">
                  <span>Identité inconnue</span>
                </label>
              </div>

              <div class="field-block">
                <label for="sex">Sexe</label>
                <select id="sex">
                  <option value="">Choisir</option>
                  <option value="Homme">Homme</option>
                  <option value="Femme">Femme</option>
                  <option value="Indéterminé / inconnu">Indéterminé / inconnu</option>
                </select>
              </div>

            </div>

            <div class="field-block">
              <label id="triageLabel">Triage courant</label>
              <input type="hidden" id="triageCurrent" value="">
              <div class="triage-picker" role="radiogroup" aria-labelledby="triageLabel">
                <button type="button" class="triage-choice u1" data-triage="U1"><strong>U1</strong><span>Urgence vitale</span></button>
                <button type="button" class="triage-choice u2" data-triage="U2"><strong>U2</strong><span>Urgence relative</span></button>
                <button type="button" class="triage-choice u3h" data-triage="U3H"><strong>U3H</strong><span>Non urgent, vers l'hôpital</span></button>
                <button type="button" class="triage-choice u3nh" data-triage="U3NH"><strong>U3NH</strong><span>Non urgent, sans hôpital</span></button>
                <button type="button" class="triage-choice implique" data-triage="IMPLIQUE"><strong>IMPLIQUE</strong><span>Impliqué, sans lésion</span></button>
                <button type="button" class="triage-choice dcd" data-triage="DCD"><strong>DCD</strong><span>Décès</span></button>
              </div>
            </div>

            <div class="patient-grid-3">
              <div class="field-block">
                <label for="lastName">Nom</label>
                <input id="lastName" type="text">
              </div>

              <div class="field-block">
                <label for="firstName">Prénom</label>
                <input id="firstName" type="text">
              </div>

              <div class="field-block">
                <label for="birthDate">Date de naissance</label>
                <input id="birthDate" type="date">
              </div>
            </div>

            <div class="patient-grid-3">
              <div class="field-block">
                <label for="ageDisplay">Âge calculé</label>
                <input id="ageDisplay" type="text" readonly>
              </div>

              <div class="field-block">
                <label for="nationality">Nationalité</label>
                <select id="nationality">
                  <option value="">Choisir</option>
                  <option value="BE">BE</option>
                  <option value="FR">FR</option>
                  <option value="NL">NL</option>
                  <option value="DE">DE</option>
                  <option value="UK">UK</option>
                  <option value="AUTRE">Autres</option>
                </select>
              </div>

              <div class="field-block">
                <label for="nationalNumber">Numéro national</label>
                <input id="nationalNumber" type="text">
              </div>
            </div>

            <div class="patient-grid-3">
              <div class="field-block">
                <label for="patientAddress">Rue et numéro</label>
                <input id="patientAddress" type="text">
              </div>

              <div class="field-block">
                <label for="postalCode">Code postal</label>
                <input id="postalCode" type="text">
              </div>

              <div class="field-block">
                <label for="locality">Localité</label>
                <input id="locality" type="text">
              </div>
            </div>

            <div class="patient-grid-2">
              <div class="field-block">
                <label for="pmaDisplay">PMA</label>
                <input id="pmaDisplay" type="text" readonly>
              </div>

              <div class="field-block">
                <label for="triageInitialDisplay">Triage initial</label>
                <input id="triageInitialDisplay" type="text" readonly>
              </div>
            </div>
          </section>

          <section class="patient-card">
            <h2 class="section-title">Clinique</h2>

            <div class="field-block">
              <label for="pathology">Groupe de pathologies</label>
              <select id="pathology">
                <option value="">Choisir</option>
                <option value="Intox">Intox</option>
                <option value="Trauma">Trauma</option>
                <option value="Malaise">Malaise</option>
                <option value="Brûlure">Brûlure</option>
                <option value="Cardio">Cardio</option>
                <option value="Respiratoire">Respiratoire</option>
                <option value="Neurologique">Neurologique</option>
                <option value="Autre">Autre</option>
              </select>
            </div>

            <div class="field-block">
              <label for="chiefComplaint">Motif / plainte principale</label>
              <textarea id="chiefComplaint" rows="3"></textarea>
            </div>

            <div class="field-block">
              <label for="clinicalNotes">Remarques cliniques</label>
              <textarea id="clinicalNotes" rows="4"></textarea>
            </div>
          </section>
        </div>

        <div class="button-row sticky-actions">
          <button id="savePatientBtn" class="btn-primary">Enregistrer</button>
        </div>
      </section>
    </section>
  </main>

  <script src="config.js"></script>
  <script type="module" src="patient.js"></script>
</body>
</html>
